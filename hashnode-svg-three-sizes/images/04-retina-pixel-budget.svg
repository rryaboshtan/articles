<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Retina PNG pixel budget from CSS size times DPR</title>
  <desc id="desc">CSS display size multiplied by device pixel ratio gives the PNG export size.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
        <style>
      .kicker { font: 700 30px "Liberation Sans", "DejaVu Sans", sans-serif; fill: #fbbf24; letter-spacing: 0.12em; }
      .title { font: 700 54px "Liberation Sans", "DejaVu Sans", sans-serif; fill: #fafaf9; }
      .lead { font: 700 34px "Liberation Sans", "DejaVu Sans", sans-serif; fill: #f5f5f4; }
      .th { font: 700 30px "Liberation Sans", "DejaVu Sans", sans-serif; fill: #a8a29e; }
      .td { font: 700 40px "Liberation Mono", "DejaVu Sans Mono", monospace; fill: #fafaf9; }
      .ok { fill: #4ade80; }
      .bad { fill: #f87171; }
      .note { font: 700 36px "Liberation Sans", "DejaVu Sans", sans-serif; fill: #fafaf9; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <text class="kicker" x="64" y="68">PNG FROM SVG</text>
  <text class="title" x="64" y="136">Pixel budget = CSS size x DPR</text>
  <text class="lead" x="64" y="196">PNG only knows how many pixels you asked for.</text>

  <rect x="64" y="250" width="1472" height="84" rx="18" fill="#292524"/>
  <text class="th" x="110" y="306">CSS SIZE</text>
  <text class="th" x="460" y="306">DPR</text>
  <text class="th" x="720" y="306">EXPORT PNG</text>
  <text class="th" x="1120" y="306">ON 2x SCREEN</text>

  <rect x="64" y="360" width="1472" height="96" rx="18" fill="#1c1917" stroke="#57534e" stroke-width="2"/>
  <text class="td" x="110" y="424">24x24</text>
  <text class="td" x="460" y="424">2x</text>
  <text class="td ok" x="720" y="424">48x48</text>
  <text class="td ok" x="1120" y="424">sharp</text>

  <rect x="64" y="476" width="1472" height="96" rx="18" fill="#1c1917" stroke="#57534e" stroke-width="2"/>
  <text class="td" x="110" y="540">24x24</text>
  <text class="td" x="460" y="540">2x</text>
  <text class="td bad" x="720" y="540">24x24</text>
  <text class="td bad" x="1120" y="540">soft</text>

  <rect x="64" y="592" width="1472" height="96" rx="18" fill="#1c1917" stroke="#57534e" stroke-width="2"/>
  <text class="td" x="110" y="656">16x16</text>
  <text class="td" x="460" y="656">2x</text>
  <text class="td ok" x="720" y="656">32x32</text>
  <text class="td ok" x="1120" y="656">sharp</text>

  <rect x="64" y="708" width="1472" height="96" rx="18" fill="#1c1917" stroke="#57534e" stroke-width="2"/>
  <text class="td" x="110" y="772">24x24</text>
  <text class="td" x="460" y="772">3x</text>
  <text class="td ok" x="720" y="772">72x72</text>
  <text class="td ok" x="1120" y="772">sharp</text>

  <text class="note" x="64" y="900">Never upscale a 16px PNG and call it retina.</text>
</svg>
