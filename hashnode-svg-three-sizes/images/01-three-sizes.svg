<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Three SVG size signals: viewBox, width/height, CSS</title>
  <desc id="desc">Diagram comparing viewBox as the contract, width and height attributes as defaults, and CSS or props as the instance size.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
        <style>
      .kicker { font: 700 30px "Liberation Sans", "DejaVu Sans", sans-serif; fill: #94a3b8; letter-spacing: 0.12em; }
      .title { font: 700 58px "Liberation Sans", "DejaVu Sans", sans-serif; fill: #f8fafc; }
      .lead { font: 700 36px "Liberation Sans", "DejaVu Sans", sans-serif; fill: #f1f5f9; }
      .label { font: 700 44px "Liberation Sans", "DejaVu Sans", sans-serif; fill: #f8fafc; }
      .mono { font: 700 32px "Liberation Mono", "DejaVu Sans Mono", monospace; fill: #f8fafc; }
      .sub { font: 700 36px "Liberation Sans", "DejaVu Sans", sans-serif; fill: #f8fafc; }
      .badge { font: 700 24px "Liberation Sans", "DejaVu Sans", sans-serif; fill: #0f172a; }
      .rule { font: 700 34px "Liberation Sans", "DejaVu Sans", sans-serif; fill: #f8fafc; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <circle cx="1440" cy="100" r="220" fill="#38bdf8" opacity="0.07"/>
  <circle cx="160" cy="860" r="240" fill="#a3e635" opacity="0.06"/>

  <text class="kicker" x="64" y="68">SVG SIZING</text>
  <text class="title" x="64" y="136">Three size signals, one contract</text>
  <text class="lead" x="64" y="192">When they disagree, the icon looks broken.</text>

  <rect x="64" y="240" width="460" height="560" rx="28" fill="#111827" stroke="#64748b" stroke-width="3"/>
  <rect x="64" y="240" width="460" height="16" rx="8" fill="url(#c1)"/>
  <text class="label" x="100" y="330">1. viewBox</text>
  <rect x="100" y="360" width="388" height="64" rx="14" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <text class="mono" x="118" y="404">viewBox="0 0 24 24"</text>
  <text class="sub" x="100" y="490">Internal coordinates.</text>
  <text class="sub" x="100" y="540">The drawing contract.</text>
  <text class="sub" x="100" y="610">Used by renderers</text>
  <text class="sub" x="100" y="660">and icon tools.</text>
  <rect x="100" y="720" width="200" height="52" rx="14" fill="#38bdf8"/>
  <text class="badge" x="132" y="755">CONTRACT</text>

  <rect x="570" y="240" width="460" height="560" rx="28" fill="#111827" stroke="#64748b" stroke-width="3"/>
  <rect x="570" y="240" width="460" height="16" rx="8" fill="url(#c2)"/>
  <text class="label" x="606" y="330">2. width / height</text>
  <rect x="606" y="350" width="388" height="120" rx="14" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <text class="mono" x="624" y="400">width="24"</text>
  <text class="mono" x="624" y="448">height="24"</text>
  <text class="sub" x="606" y="530">Default size when</text>
  <text class="sub" x="606" y="580">CSS is silent.</text>
  <text class="sub" x="606" y="650">Browser and some</text>
  <text class="sub" x="606" y="700">PNG exporters.</text>
  <rect x="606" y="740" width="190" height="52" rx="14" fill="#a3e635"/>
  <text class="badge" x="642" y="775">DEFAULT</text>

  <rect x="1076" y="240" width="460" height="560" rx="28" fill="#111827" stroke="#64748b" stroke-width="3"/>
  <rect x="1076" y="240" width="460" height="16" rx="8" fill="url(#c3)"/>
  <text class="label" x="1112" y="330">3. CSS / props</text>
  <rect x="1112" y="360" width="388" height="64" rx="14" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <text class="mono" x="1130" y="404">width={32} or CSS</text>
  <text class="sub" x="1112" y="490">Size for this spot</text>
  <text class="sub" x="1112" y="540">in the UI.</text>
  <text class="sub" x="1112" y="610">React, layout,</text>
  <text class="sub" x="1112" y="660">design tokens.</text>
  <rect x="1112" y="720" width="200" height="52" rx="14" fill="#fbbf24"/>
  <text class="badge" x="1148" y="755">INSTANCE</text>

  <text class="rule" x="64" y="880">Keep viewBox stable. Set size where the icon is used.</text>
</svg>
