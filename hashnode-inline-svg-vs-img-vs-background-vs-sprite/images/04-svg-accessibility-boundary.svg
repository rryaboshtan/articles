<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Where the accessible name belongs</title>
  <desc id="desc">Three examples show that controls need a name, meaningful images need alternative text, and decorative SVG should be hidden from assistive technology.</desc>
  <rect width="1200" height="620" fill="#0f1419"/>
  <circle cx="1120" cy="20" r="180" fill="#3d9cf0" fill-opacity=".08"/>
  <circle cx="50" cy="590" r="150" fill="#7fd99a" fill-opacity=".06"/>
  <text x="64" y="72" fill="#eef4fb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">Give the name to the right thing</text>
  <text x="64" y="108" fill="#9fb0c4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21">The path is not the interface. The surrounding element usually is.</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="64" y="158" width="342" height="360" rx="14" fill="#202d3d" stroke="#33465c"/>
    <text x="92" y="204" fill="#b34a3c" font-size="20" font-weight="700" letter-spacing="1.5">ICON BUTTON</text>
    <rect x="92" y="242" width="286" height="82" rx="10" fill="#242b33"/>
    <path d="M177 270h28l6 9h18v7h-62v-7h7l3-9zm5 24h8v20h-8v-20zm14 0h8v20h-8v-20zm14 0h8v20h-8v-20z" fill="#fff"/>
    <text x="249" y="291" fill="#fff" font-size="21" font-weight="600">Delete</text>
    <text x="92" y="368" fill="#eef4fb" font-size="20" font-weight="600">Name the button</text>
    <text x="92" y="400" fill="#9fb0c4" font-size="20">aria-label="Delete"</text>
    <text x="92" y="454" fill="#9fb0c4" font-size="20">The SVG itself can be</text>
    <text x="92" y="478" fill="#9fb0c4" font-size="20">aria-hidden="true".</text>

    <rect x="429" y="158" width="342" height="360" rx="14" fill="#202d3d" stroke="#33465c"/>
    <text x="457" y="204" fill="#2d6f9f" font-size="20" font-weight="700" letter-spacing="1.5">MEANINGFUL IMAGE</text>
    <rect x="457" y="242" width="286" height="82" rx="10" fill="#172936"/>
    <path d="M481 302l34-32 25 22 20-17 48 49H481z" fill="#5f9b9c"/>
    <circle cx="622" cy="268" r="12" fill="#e9a65a"/>
    <text x="457" y="368" fill="#eef4fb" font-size="20" font-weight="600">Describe the image</text>
    <text x="457" y="400" fill="#9fb0c4" font-size="20">alt="Funnel: 1200 visits</text>
    <text x="457" y="424" fill="#9fb0c4" font-size="20">to 84 purchases"</text>
    <text x="457" y="478" fill="#9fb0c4" font-size="20">Use the text that carries</text>
    <text x="457" y="502" fill="#9fb0c4" font-size="20">the information.</text>

    <rect x="794" y="158" width="342" height="360" rx="14" fill="#202d3d" stroke="#33465c"/>
    <text x="822" y="204" fill="#5b7c60" font-size="20" font-weight="700" letter-spacing="1.5">DECORATION</text>
    <rect x="822" y="242" width="286" height="82" rx="10" fill="#18271f"/>
    <g fill="none" stroke="#8ba68a" stroke-width="3">
      <circle cx="860" cy="283" r="20"/><circle cx="910" cy="283" r="20"/><circle cx="960" cy="283" r="20"/><circle cx="1010" cy="283" r="20"/><circle cx="1060" cy="283" r="20"/>
    </g>
    <text x="822" y="368" fill="#eef4fb" font-size="20" font-weight="600">Hide the SVG</text>
    <text x="822" y="400" fill="#9fb0c4" font-size="20">aria-hidden="true"</text>
    <text x="822" y="454" fill="#9fb0c4" font-size="20">If removing it changes</text>
    <text x="822" y="478" fill="#9fb0c4" font-size="20">nothing, it needs no name.</text>
  </g>
</svg>
