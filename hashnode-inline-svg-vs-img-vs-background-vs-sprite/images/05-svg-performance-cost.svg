<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Where SVG performance costs come from</title>
  <desc id="desc">A visual comparison of inline SVG, a cached image file, and an oversized icon import.</desc>
  <rect width="1200" height="650" fill="#0f1419"/>
  <circle cx="1120" cy="20" r="180" fill="#3d9cf0" fill-opacity=".08"/>
  <circle cx="50" cy="620" r="150" fill="#7fd99a" fill-opacity=".06"/>
  <text x="64" y="70" fill="#eef4fb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">The expensive part is not always the request</text>
  <text x="64" y="108" fill="#9fb0c4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">Look at what the browser has to download, parse, and keep alive.</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="64" y="160" width="338" height="350" rx="16" fill="#202d3d" stroke="#33465c"/>
    <text x="94" y="210" fill="#2d6f9f" font-size="25" font-weight="700">Inline UI icon</text>
    <text x="94" y="246" fill="#9fb0c4" font-size="20">Good for a small, themed glyph</text>
    <rect x="94" y="282" width="278" height="62" rx="10" fill="#172936"/>
    <text x="116" y="322" fill="#55adf7" font-size="24" font-weight="700">+ no extra request</text>
    <text x="94" y="390" fill="#eef4fb" font-size="21" font-weight="600">Cost to watch</text>
    <text x="94" y="426" fill="#9fb0c4" font-size="20">Markup in HTML or JS</text>
    <text x="94" y="458" fill="#9fb0c4" font-size="20">Parsing and hydration</text>
    <text x="94" y="490" fill="#9fb0c4" font-size="20">Unused icons still hurt</text>

    <rect x="431" y="160" width="338" height="350" rx="16" fill="#202d3d" stroke="#33465c"/>
    <text x="461" y="210" fill="#5b7c60" font-size="25" font-weight="700">&lt;img&gt; artwork</text>
    <text x="461" y="246" fill="#9fb0c4" font-size="20">Good for a figure or logo</text>
    <rect x="461" y="282" width="278" height="62" rx="10" fill="#18271f"/>
    <text x="483" y="322" fill="#7fd99a" font-size="24" font-weight="700">cached as a file</text>
    <text x="461" y="390" fill="#eef4fb" font-size="21" font-weight="600">Cost to watch</text>
    <text x="461" y="426" fill="#9fb0c4" font-size="20">Transfer size</text>
    <text x="461" y="458" fill="#9fb0c4" font-size="20">LCP for large artwork</text>
    <text x="461" y="490" fill="#9fb0c4" font-size="20">Missing dimensions</text>

    <rect x="798" y="160" width="338" height="350" rx="16" fill="#202d3d" stroke="#33465c"/>
    <text x="828" y="210" fill="#b34a3c" font-size="25" font-weight="700">The hidden tax</text>
    <text x="828" y="246" fill="#9fb0c4" font-size="20">A barrel import</text>
    <text x="828" y="270" fill="#9fb0c4" font-size="20">of all icons</text>
    <rect x="828" y="282" width="278" height="62" rx="10" fill="#332326"/>
    <text x="850" y="322" fill="#b34a3c" font-size="24" font-weight="700">180 KB main chunk</text>
    <text x="828" y="390" fill="#eef4fb" font-size="21" font-weight="600">What to do instead</text>
    <text x="828" y="426" fill="#9fb0c4" font-size="20">Measure the production build</text>
    <text x="828" y="458" fill="#9fb0c4" font-size="20">Split route-specific icons</text>
    <text x="828" y="490" fill="#9fb0c4" font-size="20">Move shared icons to a sprite</text>

    <rect x="64" y="548" width="1072" height="54" rx="12" fill="#20252b"/>
    <text x="600" y="584" text-anchor="middle" fill="#fff" font-size="23" font-weight="600">Zero requests is not the same as zero cost.</text>
  </g>
</svg>
