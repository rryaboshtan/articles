<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
  <title id="title">SVG embedding decision tree</title>
  <desc id="desc">A flowchart for choosing between inline SVG, img, CSS background, and an SVG sprite</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1419"/>
      <stop offset="100%" stop-color="#1a2634"/>
    </linearGradient>
    <linearGradient id="question" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26364a"/>
      <stop offset="100%" stop-color="#1b2735"/>
    </linearGradient>
    <linearGradient id="answer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#203248"/>
      <stop offset="100%" stop-color="#192635"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f8299"/>
    </marker>
  </defs>

  <rect width="1200" height="960" fill="url(#bg)"/>
  <circle cx="1120" cy="20" r="180" fill="#3d9cf0" fill-opacity=".08"/>
  <circle cx="40" cy="920" r="170" fill="#7fd99a" fill-opacity=".06"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="56" y="62" fill="#8b9bb0" font-size="18" font-weight="700" letter-spacing="2">CHOOSE BY PURPOSE</text>
    <text x="56" y="108" fill="#eef4fb" font-size="36" font-weight="750">How should this SVG be embedded?</text>

    <rect x="56" y="154" width="530" height="112" rx="18" fill="url(#question)" stroke="#344860"/>
    <circle cx="92" cy="190" r="18" fill="#3d9cf0"/>
    <text x="92" y="197" text-anchor="middle" fill="#0f1419" font-size="18" font-weight="800">1</text>
    <text x="126" y="194" fill="#eef4fb" font-size="23" font-weight="650">User-supplied or untrusted?</text>
    <text x="126" y="230" fill="#a8b8cc" font-size="21">Treat the source as hostile until proven otherwise.</text>

    <path d="M 586 210 H 658" stroke="#6f8299" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="614" y="194" fill="#e6c07b" font-size="20" font-weight="700">YES</text>
    <rect x="680" y="144" width="464" height="132" rx="18" fill="#332a24" stroke="#9c7044"/>
    <text x="710" y="183" fill="#f0c98a" font-size="21" font-weight="700">Sanitize first</text>
    <text x="710" y="216" fill="#d9c7ac" font-size="21">Preview with &lt;img&gt; or sanitized DOM.</text>
    <text x="710" y="246" fill="#d9c7ac" font-size="21">Never insert raw markup or innerHTML.</text>

    <path d="M 320 266 V 330" stroke="#6f8299" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="334" y="302" fill="#7fd99a" font-size="20" font-weight="700">NO</text>

    <rect x="56" y="348" width="530" height="126" rx="18" fill="url(#question)" stroke="#344860"/>
    <circle cx="92" cy="386" r="18" fill="#3d9cf0"/>
    <text x="92" y="393" text-anchor="middle" fill="#0f1419" font-size="18" font-weight="800">2</text>
    <text x="126" y="386" fill="#eef4fb" font-size="22" font-weight="650">Theme colors, hover states,</text>
    <text x="126" y="417" fill="#eef4fb" font-size="22" font-weight="650">or per-path animation?</text>
    <text x="126" y="451" fill="#a8b8cc" font-size="21">The page needs access to the SVG elements.</text>

    <path d="M 586 411 H 658" stroke="#6f8299" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="614" y="395" fill="#7fd99a" font-size="20" font-weight="700">YES</text>
    <rect x="680" y="330" width="464" height="190" rx="18" fill="url(#answer)" stroke="#356592"/>
    <text x="710" y="370" fill="#55adf7" font-size="21" font-weight="700">Use DOM-accessible SVG</text>
    <text x="710" y="405" fill="#d6e2ef" font-size="21">One-off UI &#x2192; inline or component</text>
    <text x="710" y="437" fill="#d6e2ef" font-size="21">Shared routes &#x2192; sprite</text>
    <text x="710" y="469" fill="#d6e2ef" font-size="21">Route-specific &#x2192;</text>
    <text x="710" y="493" fill="#d6e2ef" font-size="21">tree-shaken components</text>

    <path d="M 320 474 V 548" stroke="#6f8299" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="334" y="515" fill="#7fd99a" font-size="20" font-weight="700">NO</text>

    <rect x="56" y="566" width="530" height="112" rx="18" fill="url(#question)" stroke="#344860"/>
    <circle cx="92" cy="602" r="18" fill="#3d9cf0"/>
    <text x="92" y="609" text-anchor="middle" fill="#0f1419" font-size="18" font-weight="800">3</text>
    <text x="126" y="606" fill="#eef4fb" font-size="23" font-weight="650">Meaningful content?</text>
    <text x="126" y="642" fill="#a8b8cc" font-size="21">Logo, diagram, chart, or article illustration.</text>

    <path d="M 586 622 H 658" stroke="#6f8299" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="614" y="606" fill="#7fd99a" font-size="20" font-weight="700">YES</text>
    <rect x="680" y="558" width="464" height="128" rx="18" fill="url(#answer)" stroke="#3c7552"/>
    <text x="710" y="600" fill="#7fd99a" font-size="21" font-weight="700">Use &lt;img&gt;</text>
    <text x="710" y="634" fill="#d6e2ef" font-size="21">Add descriptive alt and dimensions.</text>
    <text x="710" y="661" fill="#9fb1c5" font-size="20">Empty alt only for decoration.</text>

    <path d="M 320 678 V 752" stroke="#6f8299" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="334" y="719" fill="#7fd99a" font-size="20" font-weight="700">NO</text>

    <rect x="56" y="770" width="530" height="112" rx="18" fill="url(#question)" stroke="#344860"/>
    <circle cx="92" cy="806" r="18" fill="#3d9cf0"/>
    <text x="92" y="813" text-anchor="middle" fill="#0f1419" font-size="18" font-weight="800">4</text>
    <text x="126" y="810" fill="#eef4fb" font-size="23" font-weight="650">Pure decoration?</text>
    <text x="126" y="846" fill="#a8b8cc" font-size="21">Removing it would not change the meaning.</text>

    <path d="M 586 826 H 658" stroke="#6f8299" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="614" y="810" fill="#7fd99a" font-size="20" font-weight="700">YES</text>
    <rect x="680" y="752" width="220" height="148" rx="18" fill="url(#answer)" stroke="#3c7552"/>
    <text x="708" y="794" fill="#7fd99a" font-size="20" font-weight="700">CSS background</text>
    <text x="708" y="828" fill="#d6e2ef" font-size="20">or CSS mask for</text>
    <text x="708" y="854" fill="#d6e2ef" font-size="20">a mono glyph</text>

    <path d="M 900 826 H 930" stroke="#6f8299" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="905" y="810" fill="#e6c07b" font-size="20" font-weight="700">NO</text>
    <rect x="950" y="752" width="194" height="148" rx="18" fill="#332a24" stroke="#9c7044"/>
    <text x="976" y="794" fill="#f0c98a" font-size="19" font-weight="700">Clarify the</text>
    <text x="976" y="820" fill="#f0c98a" font-size="19" font-weight="700">requirement</text>
    <text x="976" y="856" fill="#d9c7ac" font-size="20">Not an SVG</text>
    <text x="976" y="879" fill="#d9c7ac" font-size="20">embedding issue.</text>
  </g>
</svg>
